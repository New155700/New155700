<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#070310">
    <title>NN SHOP | Premium Game Services</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <style>
        :root {
            --bg-base: #070310;
            --card-bg: rgba(15, 10, 28, 0.6);
            --accent-purple: #a855f7;
            --accent-pink: #ec4899;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-base);
            font-family: 'Kanit', sans-serif;
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            position: relative;
        }

        /* เอฟเฟกต์แสงออร่าพื้นหลัง */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            opacity: 0.4;
            animation: floatOrb 12s infinite alternate ease-in-out;
            pointer-events: none;
        }
        .orb-1 { width: 280px; height: 280px; background: var(--accent-purple); top: 10%; left: 10%; }
        .orb-2 { width: 240px; height: 240px; background: var(--accent-pink); bottom: 10%; right: 10%; animation-delay: -6s; }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -40px) scale(1.2); }
        }

        #particle-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

        .auth-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 340px; /* ลดขนาดลงให้กระทัดรัดบนมือถือ */
            padding: 15px;
            animation: fadeInScale 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .auth-card {
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 28px 22px;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        /* เส้นขอบเรืองแสงแบบบางๆ */
        .auth-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 21px;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.4), transparent 40%, transparent 60%, rgba(236, 72, 153, 0.4));
            z-index: -1;
            pointer-events: none;
        }

        .brand-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            text-align: center;
            letter-spacing: 2px;
            background: linear-gradient(to bottom right, #ffffff, #d8b4fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2px;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
        }

        .brand-subtitle {
            text-align: center;
            font-size: 0.65rem;
            letter-spacing: 0.25em;
            color: var(--accent-purple);
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 22px;
            opacity: 0.8;
        }

        .input-group { position: relative; margin-bottom: 12px; transition: all 0.4s ease; }
        .input-group.collapsed { max-height: 0; margin-bottom: 0; opacity: 0; overflow: hidden; pointer-events: none; transform: translateY(-10px); }
        .input-group.expanded { max-height: 80px; margin-bottom: 12px; opacity: 1; transform: translateY(0); }

        .input-icon { position: absolute; top: 50%; left: 16px; transform: translateY(-50%); color: var(--text-muted); font-size: 0.95rem; z-index: 2; transition: color 0.3s; }
        
        .form-control { 
            width: 100%; 
            background: rgba(0, 0, 0, 0.3); 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            padding: 12px 16px 12px 42px; 
            color: #fff; 
            outline: none; 
            font-size: 0.9rem; 
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
        .form-control:focus { 
            border-color: var(--accent-purple); 
            background: rgba(168, 85, 247, 0.05);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.2), inset 0 2px 4px rgba(0,0,0,0.2);
        }
        .form-control:focus + .input-icon { color: var(--accent-purple); }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            color: white;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            margin-top: 8px;
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.25);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .btn-submit::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: skewX(-20deg); transition: 0.5s;
        }
        .btn-submit:hover::after { left: 150%; }
        .btn-submit:active { transform: translateY(2px); box-shadow: 0 2px 10px rgba(236, 72, 153, 0.2); }

        .btn-outline { 
            width: 100%; 
            background: rgba(255,255,255,0.02); 
            border: 1px solid var(--border-color); 
            color: var(--text-muted); 
            padding: 10px; 
            border-radius: 12px; 
            font-size: 0.85rem; 
            margin-top: 5px; 
            cursor: pointer; 
            transition: all 0.3s;
        }
        .btn-outline:hover { background: rgba(255,255,255,0.05); color: #fff; border-color: rgba(255,255,255,0.15); }

        .divider { display: flex; align-items: center; text-align: center; margin: 15px 0; color: #6b7280; font-size: 0.7rem; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }

        .turnstile-wrapper { 
            display: flex; 
            justify-content: center; 
            margin: 5px 0 12px 0; 
            min-height: 65px; 
            width: 100%;
            /* บังคับสเกลให้พอดี ไม่ให้ล้นกรอบ */
            transform: scale(0.9);
            transform-origin: center;
        }

        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.9) translateY(20px); filter: blur(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }
        .spinner { display: none; animation: spin 1s linear infinite; margin-right: 8px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    
    <canvas id="particle-canvas"></canvas>

    <main class="auth-wrapper">
        <div class="auth-card" id="cardContainer">
            <header>
                <h1 class="brand-logo">NN SHOP</h1>
                <p class="brand-subtitle">Premium Game Services</p>
            </header>

            <form id="authForm" onsubmit="return false;">
                <div class="input-group">
                    <input type="text" id="username" class="form-control" placeholder="ชื่อผู้ใช้งาน" required autocomplete="off">
                    <i class="fa-solid fa-user input-icon"></i>
                </div>

                <div class="input-group">
                    <input type="password" id="password" class="form-control" placeholder="รหัสผ่าน" required>
                    <i class="fa-solid fa-key input-icon"></i>
                </div>

                <div class="input-group collapsed" id="confirmPasswordGroup">
                    <input type="password" id="confirmPassword" class="form-control" placeholder="ยืนยันรหัสผ่าน">
                    <i class="fa-solid fa-shield-check input-icon"></i>
                </div>

                <div class="turnstile-wrapper">
                    <div class="cf-turnstile" 
                         data-sitekey="0x4AAAAAADOLXWmEesLlww15" 
                         data-theme="dark" 
                         data-callback="onTurnstileSuccess">
                    </div>
                </div>

                <button type="submit" id="btnSubmit" class="btn-submit">
                    <i class="fa-solid fa-circle-notch spinner" id="submitSpinner"></i>
                    <span id="submitText">เข้าสู่ระบบ</span>
                </button>

                <div class="divider">หรือ</div>

                <button type="button" class="btn-outline" id="btnToggleMode" onclick="AuthSystem.toggleMode()">
                    สร้างบัญชีผู้ใช้งานใหม่
                </button>
            </form>
        </div>
    </main>

    <script>
        class AuthController {
            constructor() {
                this.isLoginMode = true; 
                this.turnstileToken = null;
                this.btnSubmit = document.getElementById('btnSubmit');
                this.submitText = document.getElementById('submitText');
                this.spinner = document.getElementById('submitSpinner');
                this.confirmPassGroup = document.getElementById('confirmPasswordGroup');
                this.btnToggleMode = document.getElementById('btnToggleMode');
                
                document.getElementById('authForm').addEventListener('submit', (e) => this.handleSubmit(e));
            }

            setTurnstileToken(token) { this.turnstileToken = token; }

            toggleMode() {
                this.isLoginMode = !this.isLoginMode;
                if (this.isLoginMode) {
                    this.confirmPassGroup.classList.replace('expanded', 'collapsed');
                    this.submitText.innerText = 'เข้าสู่ระบบ';
                    this.btnToggleMode.innerText = 'สร้างบัญชีผู้ใช้งานใหม่';
                } else {
                    this.confirmPassGroup.classList.replace('collapsed', 'expanded');
                    this.submitText.innerText = 'ยืนยันการสมัครสมาชิก';
                    this.btnToggleMode.innerText = 'กลับไปหน้าเข้าสู่ระบบ';
                }
                // Reset แคปช่าเมื่อสลับโหมด
                if (typeof turnstile !== 'undefined') {
                    turnstile.reset();
                    this.turnstileToken = null;
                }
            }

            async handleSubmit(e) {
                e.preventDefault();
                const u = document.getElementById('username').value.trim();
                const p = document.getElementById('password').value.trim();
                const cp = document.getElementById('confirmPassword').value.trim();

                if (!u || !p) return this.showMsg('ผิดพลาด', 'กรุณากรอกข้อมูลให้ครบ', 'error');
                if (!this.isLoginMode && p !== cp) return this.showMsg('ผิดพลาด', 'รหัสผ่านไม่ตรงกัน', 'error');
                
                if (!this.turnstileToken) {
                    return this.showMsg('ความปลอดภัย', 'กรุณายืนยันว่าคุณไม่ใช่บอท', 'warning');
                }

                this.setLoading(true);

                try {
                    const response = await fetch('/api/auth', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: this.isLoginMode ? 'login' : 'register',
                            username: u,
                            password: p,
                            turnstile_token: this.turnstileToken 
                        })
                    });

                    const result = await response.json();
                    this.setLoading(false);

                    if (result.status === 'success') {
                        this.showMsg('สำเร็จ!', this.isLoginMode ? 'กำลังเข้าสู่ระบบ...' : 'สมัครสมาชิกสำเร็จแล้ว', 'success').then(() => {
                            if (this.isLoginMode) window.location.href = '/home'; 
                            else this.toggleMode();
                        });
                    } else {
                        this.showMsg('ล้มเหลว', result.msg, 'error');
                        if (typeof turnstile !== 'undefined') turnstile.reset();
                        this.turnstileToken = null;
                    }
                } catch (err) {
                    this.setLoading(false);
                    this.showMsg('ผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
                }
            }

            setLoading(isLoading) {
                this.btnSubmit.disabled = isLoading;
                this.spinner.style.display = isLoading ? 'inline-block' : 'none';
                this.submitText.innerText = isLoading ? 'กำลังประมวลผล...' : (this.isLoginMode ? 'เข้าสู่ระบบ' : 'ยืนยันการสมัครสมาชิก');
            }

            showMsg(title, text, icon) {
                return Swal.fire({
                    title, text, icon, background: '#0f0a1c', color: '#f3f4f6', confirmButtonColor: '#a855f7',
                    backdrop: `rgba(0,0,0,0.6)`
                });
            }
        }

        class ParticleNetwork {
            constructor() {
                this.canvas = document.getElementById('particle-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.resize();
                window.addEventListener('resize', () => this.resize());
                // สร้างเอฟเฟกต์อนุภาคที่ดูเนียนขึ้น
                for(let i=0; i<40; i++) this.particles.push({
                    x: Math.random()*this.canvas.width, 
                    y: Math.random()*this.canvas.height,
                    vx: (Math.random()-0.5)*0.3, 
                    vy: (Math.random()-0.5)*0.3,
                    size: Math.random() * 2 + 0.5,
                    opacity: Math.random() * 0.5 + 0.1
                });
                this.animate();
            }
            resize() { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; }
            animate() {
                this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height);
                this.particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy;
                    if(p.x<0 || p.x>this.canvas.width) p.vx*=-1;
                    if(p.y<0 || p.y>this.canvas.height) p.vy*=-1;
                    
                    this.ctx.fillStyle = `rgba(168, 85, 247, ${p.opacity})`;
                    this.ctx.beginPath(); 
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); 
                    this.ctx.fill();
                });
                requestAnimationFrame(() => this.animate());
            }
        }

        let AuthSystem;
        window.onTurnstileSuccess = (token) => {
            if (AuthSystem) AuthSystem.setTurnstileToken(token);
        };

        document.addEventListener('DOMContentLoaded', () => {
            AuthSystem = new AuthController();
            new ParticleNetwork();
        });
    </script>
</body>
</html>
